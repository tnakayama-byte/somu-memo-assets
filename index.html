<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>総務メモ</title>

  <!-- iPhone / iPad ホーム画面 -->
  <link rel="apple-touch-icon" sizes="180x180" href="./somu-memo-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="総務メモ">

  <!-- Android / PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#f7f8fa">

  <!-- 通常ブラウザのfavicon -->
  <link rel="icon" type="image/png" href="./somu-memo-icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f7f8fa;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f7f8fa;
    }

    #soumuApp {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f7f8fa;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f7f8fa;
      transition: opacity .2s ease;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    .loading-title {
      font-size: 24px;
      font-weight: 800;
      color: #17191c;
    }

    .loading-sub {
      font-size: 14px;
      color: #737980;
    }

    .fallback {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 20;
      display: none;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      text-align: center;
    }

    .fallback.show {
      display: block;
    }

    .fallback a {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #2468e8;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    <img src="./somu-memo-icon.png" alt="総務メモ">
    <div class="loading-title">総務メモ</div>
    <div class="loading-sub">読み込み中…</div>
  </div>

  <div class="app-shell">
    <iframe
      id="soumuApp"
      src="https://script.google.com/a/macros/shirokumapower.com/s/AKfycbwK0wUinQg1QTqvfjMKcu83PNBF1L1e95AchdJ-2tbRAqyIy3LsgzckCawIm3mCpC61Nw/exec"
      title="総務メモ"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <div id="fallback" class="fallback">
    <a href="https://script.google.com/a/macros/shirokumapower.com/s/AKfycbwK0wUinQg1QTqvfjMKcu83PNBF1L1e95AchdJ-2tbRAqyIy3LsgzckCawIm3mCpC61Nw/exec">
      総務メモを直接開く
    </a>
  </div>

  <script>
    const iframe = document.getElementById('soumuApp');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');

    iframe.addEventListener('load', () => {
      setTimeout(() => {
        loading.classList.add('hide');
      }, 250);
    });

    // 認証などでiframe表示がうまくいかない場合の保険
    setTimeout(() => {
      fallback.classList.add('show');
    }, 8000);
  </script>

</body>
</html>
